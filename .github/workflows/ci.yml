name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Tests
        run: go test ./...

      - name: Race tests
        run: go test -race ./...

      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: Build
        run: go build -trimpath -o bin/xrpl-node-preflight ./cmd/xrpl-node-preflight
